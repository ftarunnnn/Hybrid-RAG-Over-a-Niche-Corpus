version: '3.8'

services:
  # 1. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: netrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netrag-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_LOCATION=http://qdrant:6333
      - QDRANT_COLLECTION=networking_corpus
      - LLM_PROVIDER=auto
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # 3. Streamlit Frontend UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netrag-frontend
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
